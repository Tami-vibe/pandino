name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Line meter
        id: meter
        run: |
          set +e
          node scripts/loc-meter.mjs --base "origin/${{ github.base_ref }}" > meter.txt
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat meter.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Post meter comment
        if: always() && steps.meter.conclusion != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- pandino-loc-meter -->";
            let table = "(line meter did not produce a report)";
            if (fs.existsSync("meter.txt")) table = fs.readFileSync("meter.txt", "utf8").trimEnd();
            const body = `${marker}\n## Line budget\n\n\`\`\`\n${table}\n\`\`\`\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce line budget
        if: steps.meter.outputs.status != ''
        run: exit ${{ steps.meter.outputs.status }}
